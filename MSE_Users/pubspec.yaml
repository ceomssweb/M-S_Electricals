name: rasi_customer
description: M&S Electricals — customer app for browsing services and booking jobs.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0

  go_router: ^18.0.2
  provider: ^6.1.2

  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0

  razorpay_flutter: ^1.3.7

  google_fonts: ^9.0.0
  cached_network_image: ^4.0.4
  shimmer: ^4.0.0
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  permission_handler: ^13.0.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
